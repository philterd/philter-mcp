name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build
      - name: Verify the server starts and registers its tools
        run: |
          pip install -e .
          python - <<'PY'
          import asyncio
          from philter_mcp.server import mcp
          tools = {t.name for t in asyncio.run(mcp.list_tools())}
          expected = {"redact_text", "redact_file", "explain_redactions",
                      "list_policies", "get_policy", "status"}
          assert tools == expected, f"unexpected tools: {tools}"
          print("OK:", sorted(tools))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
