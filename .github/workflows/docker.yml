name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q

  # Builds the images so a broken Dockerfile fails a pull request. Publishing is
  # deliberately not done here: images are pushed by hand with push-image.sh.
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The image installs the package on the target platform, which needs
      # emulation for arm64.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build image for every published platform
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # A multi-platform image cannot be loaded, so load the runner's own
      # platform from the cache to test with.
      - name: Load the amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: philterd/philter-mcp:latest
          cache-from: type=gha

      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint python philterd/philter-mcp:latest \
            -c "from philter_mcp.server import mcp; print('image OK')"
