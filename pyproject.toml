[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "philter-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for PII and PHI redaction with Philter."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Philterd, LLC", email = "support@philterd.ai" }]
keywords = ["mcp", "philter", "pii", "phi", "redaction", "privacy", "llm", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
philter-mcp = "philter_mcp.server:main"

[project.urls]
Homepage = "https://www.philterd.ai/philter/"
Repository = "https://github.com/philterd/philter-mcp"
Issues = "https://github.com/philterd/philter-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/philter_mcp"]
